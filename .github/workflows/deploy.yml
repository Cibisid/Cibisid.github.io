name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the site be redeployed by hand without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN needs to write Pages and mint an OIDC token for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs are allowed to finish so a
# half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The interactive panels claim to run the same logic as the Python in the
      # TrialBridge repo. If that stops being true the site is misrepresenting
      # the project, so the claim is checked before anything ships.
      - name: Verify browser ports match the Python
        run: npm run verify:port

      - name: Build static export
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
